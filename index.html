<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Minecraft</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .play-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .play-btn:hover {
            background: #218838;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <button class="play-btn" onclick="window.location.href='playmc.html'">
        Play Now
    </button>

</body>
</html>
